<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 14 – Labor force by age group</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 620px; }
      .note { position: fixed; left: 12px; bottom: 10px; right: 12px; font-size: 12px; color: #475569; }
      #err { position: fixed; left: 12px; top: 10px; right: 12px; padding: 10px; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; border-radius: 8px; font-size: 13px; display: none; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <div id="chart"></div>
    <div class="note">
      Percentages are within each labor-force subgroup (e.g., employed veterans), matching the published table layout.
    </div>
    <script>
      (async function () {
        const err = document.getElementById("err");
        try {
          const res = await fetch("data/table14.json", { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load data/table14.json — run texasvets_eda.R to export.");
          const j = await res.json();
          const rows = j.rows || [];
          const yr = (j.meta && j.meta.year) ? String(j.meta.year) : "";
          const src = (j.meta && j.meta.source) ? j.meta.source : "";

          const x = rows.map((r) => r.age);

          function trace(name, values, color, custom) {
            return {
              type: "bar",
              name,
              x,
              y: values,
              marker: { color },
              customdata: custom,
              hovertemplate:
                "<b>Age %{x}</b><br>" +
                "%{fullData.name}: %{y:,.0f}<br>" +
                "% within subgroup: %{customdata.pct:.1f}%<br>" +
                "Total employed (all): %{customdata.total_employed_all:,.0f}<extra></extra>"
            };
          }

          const data = [
            trace(
              "Employed veterans",
              rows.map((r) => r.employed_vet_n),
              "#1f4d2e",
              rows.map((r) => ({ pct: r.employed_vet_pct, total_employed_all: r.total_employed_all }))
            ),
            trace(
              "Unemployed veterans",
              rows.map((r) => r.unemployed_vet_n),
              "#3d7a4b",
              rows.map((r) => ({ pct: r.unemployed_vet_pct, total_employed_all: r.total_employed_all }))
            ),
            trace(
              "Employed nonveterans",
              rows.map((r) => r.employed_nonvet_n),
              "#7fae86",
              rows.map((r) => ({ pct: r.employed_nonvet_pct, total_employed_all: r.total_employed_all }))
            ),
            trace(
              "Unemployed nonveterans",
              rows.map((r) => r.unemployed_nonvet_n),
              "#dce8d8",
              rows.map((r) => ({ pct: r.unemployed_nonvet_pct, total_employed_all: r.total_employed_all }))
            )
          ];

          const layout = {
            title: { text: "Labor force participants by age group (Texas)" + (yr ? " — " + yr : ""), x: 0.02 },
            barmode: "group",
            margin: { l: 70, r: 20, t: 70, b: 60 },
            yaxis: { title: "Estimated number of people", rangemode: "tozero" },
            xaxis: { title: "Age group" },
            legend: { orientation: "h", x: 0.02, y: 1.12 },
            paper_bgcolor: "white",
            plot_bgcolor: "white",
            annotations: src ? [{ text: src, xref: "paper", yref: "paper", x: 0, y: -0.12, showarrow: false, font: { size: 11, color: "#64748b" } }] : []
          };

          Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
        } catch (e) {
          err.style.display = "block";
          err.textContent = e.message || String(e);
        }
      })();
    </script>
  </body>
</html>
