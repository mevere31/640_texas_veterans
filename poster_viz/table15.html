<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 15 – Class of Worker</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 620px; }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script>
      // Source: TWIC Veterans in Texas report (Dec 2025 update)
      // Table 15: Class of Worker for Texas Veteran Labor Force Participants, 2023
      const rows = [
        { label: "Employee of a private for-profit company", n: 468567, pct: 62.0 },
        { label: "Employee of federal, state, local government", n: 175383, pct: 23.2 },
        { label: "Self-employed in own business, professional practice, or farm", n: 73057, pct: 9.7 },
        { label: "Employee of a private not-for-profit organization", n: 34199, pct: 4.5 },
        { label: "Unemployed and never worked", n: 3150, pct: 0.4 },
        { label: "Working without pay in family business or farm", n: 1632, pct: 0.2 },
      ];

      const data = [{
        type: "pie",
        labels: rows.map(r => r.label),
        values: rows.map(r => r.n),
        textinfo: "label+percent",
        hovertemplate: "<b>%{label}</b><br>%{value:,} (%{percent})<extra></extra>",
        sort: false,
        marker: {
          colors: ["#1d4ed8", "#0ea5e9", "#22c55e", "#a78bfa", "#f59e0b", "#94a3b8"]
        }
      }];

      const layout = {
        title: { text: "Table 15: Class of worker (Texas veteran labor force, 2023)", x: 0.02 },
        margin: { l: 20, r: 20, t: 70, b: 20 },
        paper_bgcolor: "white",
        plot_bgcolor: "white",
      };

      Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
    </script>
  </body>
</html>
