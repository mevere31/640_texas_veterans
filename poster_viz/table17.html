<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 17 – Top Occupations of Veterans in Texas</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 720px; }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script>
      // Source: TWIC Veterans in Texas report (Dec 2025 update)
      // Table 17: Top 20 Occupations of Veterans in Texas, 2023
      const rows = [
        { occupation: "Managers", n: 33886, pct: 4.7 },
        { occupation: "Driver/Sales Workers and Truck Drivers", n: 33506, pct: 4.6 },
        { occupation: "Police officers", n: 15808, pct: 2.2 },
        { occupation: "Security Guards and Gambling Surveillance officers", n: 12250, pct: 1.7 },
        { occupation: "Registered Nurses", n: 12122, pct: 1.7 },
        { occupation: "Retail Salespersons", n: 11043, pct: 1.5 },
        { occupation: "First-Line Supervisors of Retail Sales Workers", n: 10938, pct: 1.5 },
        { occupation: "Customer Service Representatives", n: 10795, pct: 1.5 },
        { occupation: "Laborers and Freight, Stock, and Material Movers", n: 9299, pct: 1.3 },
        { occupation: "Chief Executives and Legislators", n: 8752, pct: 1.2 },
        { occupation: "Software Developers", n: 8714, pct: 1.2 },
        { occupation: "General and Operations Managers", n: 8263, pct: 1.1 },
        { occupation: "Elementary and Middle School Teachers", n: 8222, pct: 1.1 },
        { occupation: "Maintenance and Repair Workers, General", n: 8181, pct: 1.1 },
        { occupation: "Janitors and Building Cleaners", n: 7958, pct: 1.1 },
        { occupation: "Construction Managers", n: 7787, pct: 1.1 },
        { occupation: "Stockers and order Fillers", n: 7147, pct: 1.0 },
        { occupation: "Sales Representatives, Wholesale and Manufacturing", n: 6867, pct: 1.0 },
        { occupation: "Inspectors, Testers, Sorters, Samplers, and Weighers", n: 6843, pct: 0.9 },
        { occupation: "Computer Occupations", n: 6458, pct: 0.9 },
      ];

      rows.sort((a, b) => b.n - a.n);

      const data = [{
        type: "bar",
        orientation: "h",
        x: rows.map(r => r.n),
        y: rows.map(r => r.occupation),
        customdata: rows.map(r => r.pct),
        hovertemplate:
          "<b>%{y}</b><br>" +
          "Number employed: %{x:,}<br>" +
          "Percent of employed veterans: %{customdata:.1f}%<extra></extra>",
        marker: { color: "#2f6b3b" }
      }];

      const layout = {
        title: { text: "Table 17: Top 20 occupations of veterans in Texas (2023)", x: 0.02 },
        margin: { l: 430, r: 30, t: 70, b: 60 },
        xaxis: { title: "Number of employed veterans", rangemode: "tozero" },
        yaxis: { automargin: true },
        paper_bgcolor: "white",
        plot_bgcolor: "white",
      };

      Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
    </script>
  </body>
</html>
