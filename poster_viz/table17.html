<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 17 – Top occupations</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 720px; }
      #err { position: fixed; left: 12px; top: 10px; right: 12px; padding: 10px; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; border-radius: 8px; font-size: 13px; display: none; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <div id="chart"></div>
    <script>
      (async function () {
        const err = document.getElementById("err");
        try {
          const res = await fetch("data/table17.json", { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load data/table17.json — run texasvets_eda.R to export.");
          const j = await res.json();
          const rows = (j.rows || []).slice().sort((a, b) => b.n - a.n);
          const yr = (j.meta && j.meta.year) ? String(j.meta.year) : "";
          const src = (j.meta && j.meta.source) ? j.meta.source : "";

          const data = [{
            type: "bar",
            orientation: "h",
            x: rows.map((r) => r.n),
            y: rows.map((r) => r.occupation),
            customdata: rows.map((r) => r.pct),
            hovertemplate:
              "<b>%{y}</b><br>" +
              "Estimated employed: %{x:,.0f}<br>" +
              "% of employed veterans: %{customdata:.1f}%<extra></extra>",
            marker: { color: "#2f6b3b" }
          }];

          const layout = {
            title: { text: "Top 20 occupations (employed Texas veterans)" + (yr ? " — " + yr : ""), x: 0.02 },
            margin: { l: 430, r: 30, t: 70, b: 60 },
            xaxis: { title: "Estimated number employed", rangemode: "tozero" },
            yaxis: { automargin: true },
            paper_bgcolor: "white",
            plot_bgcolor: "white",
            annotations: src ? [{ text: src, xref: "paper", yref: "paper", x: 0, y: -0.08, showarrow: false, font: { size: 11, color: "#64748b" } }] : []
          };

          Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
        } catch (e) {
          err.style.display = "block";
          err.textContent = e.message || String(e);
        }
      })();
    </script>
  </body>
</html>
