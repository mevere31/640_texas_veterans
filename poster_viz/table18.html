<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 18 – Salary by Educational Attainment</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 620px; }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script>
      // Source: TWIC Veterans in Texas report (Dec 2025 update)
      // Table 18: Average Yearly Salary for Texas Total Veteran Labor Force Participants by Educational Attainment, 2023
      const rows = [
        { edu: "Less than ninth grade", pct: 1.3, salary: 43347 },
        { edu: "Grade 9–12, no diploma", pct: 1.6, salary: 41662 },
        { edu: "High school graduate (includes equivalency)", pct: 20.7, salary: 53779 },
        { edu: "Some college, no degree", pct: 28.2, salary: 62645 },
        { edu: "Associate's degree", pct: 12.6, salary: 65129 },
        { edu: "Bachelor's degree", pct: 21.3, salary: 90956 },
        { edu: "Master's degree or higher", pct: 14.5, salary: 124355 },
      ];

      const data = [
        {
          type: "bar",
          name: "Avg yearly salary",
          x: rows.map(r => r.edu),
          y: rows.map(r => r.salary),
          customdata: rows.map(r => r.pct),
          hovertemplate:
            "<b>%{x}</b><br>" +
            "Average salary: $%{y:,.0f}<br>" +
            "Share of veteran labor force: %{customdata:.1f}%<extra></extra>",
          marker: { color: "#7c3aed" }
        }
      ];

      const layout = {
        title: { text: "Table 18: Average yearly salary by educational attainment (Texas veterans, 2023)", x: 0.02 },
        margin: { l: 70, r: 20, t: 70, b: 160 },
        yaxis: { title: "Average yearly salary (USD)", tickprefix: "$", separatethousands: true, rangemode: "tozero" },
        xaxis: { tickangle: -35 },
        paper_bgcolor: "white",
        plot_bgcolor: "white",
      };

      Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
    </script>
  </body>
</html>
