<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive map – Texas veterans by county (2023)</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #fff; }
      #chart { width: 100%; height: 100vh; min-height: 620px; }
      #status {
        position: fixed;
        left: 12px;
        top: 10px;
        padding: 8px 10px;
        background: rgba(255,255,255,0.92);
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-size: 12px;
        color: #334155;
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <div id="status">Loading map…</div>

    <script>
      // Data source: TWIC "Veterans in Texas: A Demographic Study" (Dec 2025 update), Appendix C tables (county totals, 2023).
      // This visualization is designed for GitHub Pages / Adobe Express embedding.

      const PALETTE = {
        dark:  "#1f4d2e",
        mid:   "#2f6b3b",
        mid2:  "#4a8b57",
        light: "#7fae86",
        light2:"#b7c9b3",
        faint: "#dce8d8",
      };

      const colorscale = [
        [0.00, PALETTE.faint],
        [0.20, PALETTE.light2],
        [0.40, PALETTE.light],
        [0.60, PALETTE.mid2],
        [0.80, PALETTE.mid],
        [1.00, PALETTE.dark],
      ];

      function norm(s) {
        return (s || "")
          .toLowerCase()
          .replace(/county/g, "")
          .replace(/[^a-z0-9]/g, "");
      }

      async function loadCsv(url) {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load CSV: ${res.status} ${res.statusText}`);
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);
        const header = lines.shift().split(",");
        const idxCounty = header.indexOf("county");
        const idxVets = header.indexOf("veterans_2023");
        if (idxCounty === -1 || idxVets === -1) throw new Error("CSV missing expected columns.");

        const map = new Map(); // norm(county) -> value
        for (const line of lines) {
          // county names in this dataset do not contain commas; safe split
          const parts = line.split(",");
          const county = parts[idxCounty];
          const v = Number(parts[idxVets]);
          if (!county || !Number.isFinite(v)) continue;
          map.set(norm(county), v);
        }
        return map;
      }

      async function loadTexasCountiesGeoJson() {
        // Plotly-maintained US counties geojson (FIPS id per feature)
        const url = "https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json";
        const res = await fetch(url, { cache: "force-cache" });
        if (!res.ok) throw new Error(`Failed to load geojson: ${res.status} ${res.statusText}`);
        const us = await res.json();

        // Keep only Texas counties (state FIPS 48)
        const txFeatures = (us.features || []).filter(f => String(f.id || "").startsWith("48"));
        return { type: "FeatureCollection", features: txFeatures };
      }

      function getCountyNameFromFeature(feature) {
        // Different geojsons use different property keys
        return (
          feature?.properties?.NAME ||
          feature?.properties?.name ||
          feature?.properties?.County ||
          feature?.properties?.county ||
          ""
        );
      }

      async function main() {
        const statusEl = document.getElementById("status");
        try {
          const [countyValues, geojson] = await Promise.all([
            loadCsv("county_veterans_2023.csv"),
            loadTexasCountiesGeoJson(),
          ]);

          const fips = [];
          const z = [];
          const hoverCounty = [];

          let matched = 0;
          const missing = [];

          for (const f of geojson.features) {
            const name = getCountyNameFromFeature(f);
            const key = norm(name);
            const value = countyValues.get(key);
            if (value == null) {
              missing.push(name);
              continue;
            }
            matched += 1;
            fips.push(String(f.id));
            z.push(value);
            hoverCounty.push(name);
          }

          statusEl.textContent = `Matched ${matched} / ${geojson.features.length} Texas counties`;
          if (missing.length) {
            console.warn("Counties missing in CSV match:", missing.slice(0, 50));
          }

          const data = [{
            type: "choropleth",
            geojson,
            locations: fips,
            z,
            featureidkey: "id",
            colorscale,
            marker: { line: { color: "white", width: 0.4 } },
            colorbar: { title: "Veterans (2023)" },
            hovertemplate:
              "<b>%{text} County</b><br>" +
              "Veterans (2023): %{z:,}<extra></extra>",
            text: hoverCounty,
          }];

          const layout = {
            title: { text: "Texas veterans by county (2023)", x: 0.02 },
            margin: { l: 10, r: 10, t: 70, b: 10 },
            geo: {
              scope: "usa",
              fitbounds: "locations",
              visible: false,
              showlakes: false,
              bgcolor: "rgba(0,0,0,0)"
            },
            paper_bgcolor: "white",
            plot_bgcolor: "white",
          };

          Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
        } catch (e) {
          console.error(e);
          statusEl.textContent = `Error: ${e.message}`;
        }
      }

      main();
    </script>
  </body>
</html>
