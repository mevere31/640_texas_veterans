<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table 15 – Class of worker</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      #chart { width: 100%; height: 100vh; min-height: 620px; }
      #err { position: fixed; left: 12px; top: 10px; right: 12px; padding: 10px; background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; border-radius: 8px; font-size: 13px; display: none; }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <div id="chart"></div>
    <script>
      (async function () {
        const err = document.getElementById("err");
        try {
          const res = await fetch("data/table15.json", { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load data/table15.json — run texasvets_eda.R to export.");
          const j = await res.json();
          const rows = j.rows || [];
          const yr = (j.meta && j.meta.year) ? String(j.meta.year) : "";
          const src = (j.meta && j.meta.source) ? j.meta.source : "";

          const pal = ["#1f4d2e", "#2f6b3b", "#4a8b57", "#7fae86", "#b7c9b3", "#dce8d8"];
          const data = [{
            type: "pie",
            labels: rows.map((r) => r.label),
            values: rows.map((r) => r.n),
            textinfo: "label+percent",
            hovertemplate: "<b>%{label}</b><br>%{value:,.0f} (%{percent})<extra></extra>",
            sort: false,
            marker: { colors: rows.map((_, i) => pal[i % pal.length]) }
          }];

          const layout = {
            title: { text: "Class of worker (Texas veteran labor force)" + (yr ? " — " + yr : ""), x: 0.02 },
            margin: { l: 20, r: 20, t: 70, b: 20 },
            paper_bgcolor: "white",
            plot_bgcolor: "white",
            annotations: src ? [{ text: src, xref: "paper", yref: "paper", x: 0, y: -0.06, showarrow: false, font: { size: 11, color: "#64748b" } }] : []
          };

          Plotly.newPlot("chart", data, layout, { responsive: true, displayModeBar: false });
        } catch (e) {
          err.style.display = "block";
          err.textContent = e.message || String(e);
        }
      })();
    </script>
  </body>
</html>
